server.port=8082

# SQLite соединение
 # путь к файлу SQLite - изменить название?
spring.datasource.url=jdbc:sqlite:./data/quiz.db
 # JDBC-драйвер
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate конфигурация
 # Диалект SQLite для Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
 # Автоматическое обновление структуры таблиц
spring.jpa.hibernate.ddl-auto=update

# Вывод SQL-запросов в консоль
spring.jpa.show-sql=true